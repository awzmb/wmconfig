# Kernel tuning for a Ceph node. BlueStore OSDs are the demanding client here;
# the defaults are sized for a laptop and Ceph trips over them.

# BlueStore uses libaio heavily; the 65536 default is shared system-wide and an
# OSD alone can exhaust it ("bdev(...) aio submit got (11) Resource temporarily
# unavailable"). Upstream ceph.io recommends 1048576.
fs.aio-max-nr = 1048576

# Each OSD spawns a lot of threads; the default pid_max (32768) is the documented
# cause of "cannot fork"/OOM-looking failures on dense nodes.
kernel.pid_max = 4194304

# ponytail: two knobs only, both from the upstream Ceph OS-recommendations page.
# Network buffer / MTU tuning is fabric-specific — measure before adding it.
