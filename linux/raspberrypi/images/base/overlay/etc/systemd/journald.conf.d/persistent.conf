# ponytail: persist the journal to /var/log/journal so logs survive a
# crash/reboot loop during boot debugging (journald auto-creates the dir on
# start when Storage=persistent). Without this, a boot that reboots itself
# takes its logs with it and there's no way to inspect what happened.
#
# ponytail: capped at 200M because /var is on the SD card, which wears out
# under continuous writes. Raise it (or set Storage=volatile) if the journal
# rate ever matters more than the card.
[Journal]
Storage=persistent
SystemMaxUse=200M
