# Grow the root filesystem to fill the card on a Raspberry Pi.
#
# fedora-bootc ships bootc-generic-growpart.service (statically enabled via
# local-fs.target.wants) but guards it with ConditionVirtualization=vm, so on
# bare metal it is skipped and the root partition stays at the image's ~8.5 GiB
# no matter how large the card is. An empty assignment RESETS the condition
# list, which re-enables the unit here without touching the vendor unit.
#
# The service is safe to run every boot: growpart reports NOCHANGE: once the
# partition already fills the disk, and systemd-growfs is idempotent.
#
# ponytail: drop-in over the vendor unit rather than our own resize script.
# Delete it if Fedora ever drops the ConditionVirtualization guard.
[Unit]
ConditionVirtualization=
