[preferred]
# gnome backend handles Settings/Account/etc.; force ScreenCast + Screenshot to
# the wlr backend so its chooser (slurp) is used for picking an output/region.
# gnome's ScreenCast has no working picker under sway, so slurp never fires.
default=gnome
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
