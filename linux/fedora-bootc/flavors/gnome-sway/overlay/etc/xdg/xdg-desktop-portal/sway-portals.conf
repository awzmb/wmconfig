[preferred]
# gnome backend handles Settings/Account/etc.; force ScreenCast + Screenshot to
# the wlr backend so its chooser (slurp) is used for picking an output/region.
# gnome's ScreenCast has no working picker under sway, so slurp never fires.
default=gnome
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# ponytail: the gnome backend does NOT implement FileChooser, it proxies it to
# org.gnome.Nautilus, which never answers in a sway session -> flatpak apps get
# no file dialog at all. gtk implements it in-process. Revert to gnome if the
# Nautilus delegation ever works outside a GNOME session.
org.freedesktop.impl.portal.FileChooser=gtk
