# Global Flatpak override: let every app read the host GTK theme config, so
# flatpak'd GTK apps match the rest of the desktop instead of falling back to
# stock Adwaita. Equivalent to:
#   flatpak override --system --filesystem=xdg-config/gtk-3.0:ro \
#                             --filesystem=xdg-config/gtk-4.0:ro
#
# The override file lives in /var (flatpak's system installation), which image
# content can't ship, so tmpfiles seeds it. `f` only writes when the file is
# absent — a later `flatpak override` by hand is never clobbered.
#
# ponytail: read-only + these two paths only, matching the command above. Widen
# with more entries in the same semicolon list if apps need more.
f /var/lib/flatpak/overrides/global 0644 root root - [Context]\nfilesystems=xdg-config/gtk-3.0:ro;xdg-config/gtk-4.0:ro;\n
