# Stop apps (browsers/WebRTC/Teams/Discord/etc.) from auto-adjusting the mic volume.
# ponytail: "~.*" on three keys = "any client"; an empty match {} matches NOTHING
# (pw_conf_find_match needs match > 0), so at least one key must be present.
pulse.rules = [
    {
        matches = [
            { application.name = "~.*" }
            { application.process.binary = "~.*" }
            { application.process.id = "~.*" }
        ]
        actions = { quirks = [ block-source-volume ] }
    }
]
